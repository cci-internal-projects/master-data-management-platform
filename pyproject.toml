[project]
name = "mdm-platform"
version = "0.1.0"
description = "Master data management platform for meter data management system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "airflow-dag-slot-booking-cc>=0.0.1",
    "airflow-dagsmith>=0.2.0",
    "celery>=5.6.3",
    "django>=6.0.8",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-stubs>=6.1.1",
    "django-tasks>=0.12.0",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.5",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "apache-airflow>=3.3.2",
    "pyrefly>=1.3.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
exclude = [".venv",".git"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E712"]
