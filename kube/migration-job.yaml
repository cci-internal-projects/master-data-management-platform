apiVersion: batch/v1
kind: Job
metadata:
  # Jobs have immutable pod templates. Rename this resource when a later image
  # release must execute migrations again under Flux.
  name: mdm-platform-migrate-v1-0-2
  labels:
    app.kubernetes.io/name: mdm-platform
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdm-platform
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: replace-from-configmap
      containers:
        - name: mdm-platform
          image: mdm-platform
          imagePullPolicy: IfNotPresent
          command:
            - /mdm-platform/scripts/init.sh
          env:
            - name: UV_NO_SYNC
              value: "1"
          envFrom:
            - configMapRef:
                name: mdm-platform-config
            - secretRef:
                name: mdm-platform-application
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
