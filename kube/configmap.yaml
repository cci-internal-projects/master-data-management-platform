apiVersion: v1
kind: ConfigMap
metadata:
  name: mdm-platform-config
data:
  # Django and Gunicorn runtime configuration.
  DEBUG: "False"
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "1"
  TIMEOUT: "120"
  ALLOWED_HOSTS: "byplmdmsdev-mdm-platform.bsesdelhi.com"
  CSRF_TRUSTED_ORIGINS: "https://byplmdmsdev-mdm-platform.bsesdelhi.com"

  # External PostgreSQL. POSTGRES_PASSWORD belongs in secret.yaml.
  POSTGRES_HOST: "replace-with-bypl-postgres-host"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "mdm-platform"
  POSTGRES_USER: "mdm-platform"

  # The current web process does not require Redis at startup. Keep this value
  # correct before enabling Celery workers or asynchronous tasks.
  REDIS_URL: "redis://redis.mdm-platform.svc.cluster.local:6379/0"

  # ZONOS connection metadata. The password belongs in secret.yaml.
  ZONOS_NORTHBOUND_BASE_URL: "replace-with-bypl-zonos-base-url"
  ZONOS_NORTHBOUND_TOKEN_URL: "replace-with-bypl-zonos-token-url"
  ZONOS_NORTHBOUND_USERNAME: "replace-with-bypl-zonos-username"

  # Initial administrator identity. The password belongs in secret.yaml.
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "replace-with-approved-admin-email"

  # Deployment settings consumed by kube/kustomization.yaml replacements.
  INGRESS_HOST: "byplmdmsdev-mdm-platform.bsesdelhi.com"
  INGRESS_CLASS: "traefik-mdm-platform"
  INGRESS_TLS_SECRET: "bypl-certificate"
  IMAGE_PULL_SECRET: "docker-secret"
